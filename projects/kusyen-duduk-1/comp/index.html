<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<!-- Kusyen duduk #1, "Kafe kopi & kraft" look: kraft-paper tags on twine, coffee beans, a latte swirl, an espresso
     chip under the spoken word and a chalkboard menu end card. The cut video (base.mp4), timings and her head boxes
     come from edit.py via data.js; this file draws, animates and places every graphic outside the centre keep-out
     box (product + her body) and clear of her face. -->
<script src="gsap.min.js"></script>
<script src="data.js"></script>
<style>
  @font-face { font-family: "Fredoka"; src: url("Fredoka-Bold.ttf") format("truetype"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #root { width: 100%; height: 100%; position: relative; overflow: hidden; font-family: "Fredoka", sans-serif; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #fx { position: absolute; inset: 0; pointer-events: none; }

  /* kraft-paper tag: notched left end with a punched hole and twine, cream stitching, espresso ink, red accent */
  .kraft { position: absolute; left: 0; top: 0; opacity: 0; transform-origin: 0% 50%; }
  .kraft .paper { position: relative; display: flex; align-items: center; gap: 16px; white-space: nowrap;
                  padding: 16px 30px 18px 60px; color: #3B2416; font-size: 56px; line-height: 1.02;
                  letter-spacing: 0.5px;
                  clip-path: polygon(26px 0, 100% 0, 100% 100%, 26px 100%, 0 50%);
                  background:
                    repeating-linear-gradient(97deg, rgba(90, 60, 30, 0.0) 0 9px, rgba(90, 60, 30, 0.07) 9px 11px),
                    repeating-linear-gradient(7deg, rgba(255, 240, 210, 0.0) 0 13px, rgba(255, 240, 210, 0.10) 13px 15px),
                    linear-gradient(180deg, #D8B48A 0%, #C9A074 100%);
                  filter: drop-shadow(0 8px 0 rgba(59, 36, 22, 0.55)) drop-shadow(0 14px 18px rgba(0, 0, 0, 0.25)); }
  .kraft .paper::after { content: ""; position: absolute; inset: 9px 9px 9px 34px; border: 3px dashed rgba(255, 246, 228, 0.85);
                         border-radius: 6px; pointer-events: none; }
  .kraft .hole { position: absolute; left: 26px; top: 50%; width: 22px; height: 22px; margin-top: -11px;
                 border-radius: 50%; background: #5A3A22; box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.4); }
  .kraft b { color: #C8102E; font-weight: 700; }
  .kraft .w { display: inline-block; }
  .kraft .emo { display: inline-flex; align-items: center; justify-content: center; width: 1.25em; height: 1.25em;
                border-radius: 50%; background: #FFF4E2; border: 4px solid #3B2416; font-size: 0.78em; flex: none; }
  .kraft.wrapline .paper { white-space: normal; flex-wrap: wrap; row-gap: 4px; }
  .kraft .twine { position: absolute; left: -64px; top: 50%; width: 110px; height: 60px; margin-top: -40px;
                  overflow: visible; }

  /* captions: cream words with espresso outline; the spoken word sits on an espresso "menu chip" in latte ink */
  .cap { position: absolute; left: 0; top: 0; display: flex; gap: 22px; align-items: center; opacity: 0;
         font-size: 70px; line-height: 1; letter-spacing: 0.5px; }
  .cap .word { position: relative; display: inline-block; }
  .cap .word .a { position: relative; z-index: 1; display: block; white-space: nowrap; color: #FFF6E6;
                  -webkit-text-stroke: 13px #3B2416; paint-order: stroke fill; }
  .cap .word.key .a { color: #F2C38B; }
  .cap .chip { position: absolute; z-index: 0; left: -16px; right: -16px; top: -12px; bottom: -14px;
               border-radius: 18px; background: #3B2416; border: 4px solid #F2C38B; opacity: 0; }
  .cap .word .y { position: absolute; z-index: 1; left: 0; top: 0; white-space: nowrap; color: #FFE1B0;
                  opacity: 0; }

  /* steam flash between sections: edges only, the middle stays clear */
  .steam { position: absolute; inset: 0; opacity: 0;
           background: radial-gradient(ellipse 70% 62% at 50% 50%, rgba(255, 244, 226, 0) 55%,
                                       rgba(255, 244, 226, 0.75) 100%); }

  /* progress: a twine line along the top with a coffee cup riding it */
  #twine { position: absolute; height: 8px; border-radius: 4px; background: rgba(255, 246, 228, 0.45); }
  #twine .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 4px;
                 background: repeating-linear-gradient(90deg, #C9A074 0 14px, #8B5E3C 14px 20px);
                 transform-origin: 0 50%; }
  #twine .cup { position: absolute; top: -24px; left: -24px; font-size: 44px; line-height: 1; }

  /* end card: compact chalkboard menu */
  .board { position: absolute; left: 0; top: 0; opacity: 0; padding: 26px 40px 30px; border-radius: 22px;
           background: radial-gradient(circle at 30% 20%, #3A4740 0%, #26302B 70%);
           border: 12px solid #8B5E3C; box-shadow: 0 0 0 4px #3B2416, 0 16px 28px rgba(0, 0, 0, 0.35);
           display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .board .title { font-size: 60px; color: #FFF6E6; white-space: nowrap; line-height: 1;
                  text-shadow: 0 0 1px rgba(255, 255, 255, 0.6); }
  .board .title b { color: #F2C38B; }
  .board .sub { font-size: 34px; color: #E9E2D4; white-space: nowrap; opacity: 0.92; }
  .board .cta { margin-top: 6px; font-size: 40px; color: #3B2416; background: #F6D84A; white-space: nowrap;
                padding: 12px 30px 14px; border-radius: 40px; border: 4px solid #3B2416; }
  .board .rule { width: 80%; height: 0; border-top: 3px dashed rgba(233, 226, 212, 0.6); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="27.680" data-width="1080" data-height="1920">
  <video id="bg" class="clip" src="base.mp4" data-start="0" data-duration="27.680" muted playsinline></video>
  <div id="fx"></div>
</div>
<script>
(function () {
  const E = window.EDIT, S = E.safe, CX = (S.l + S.r) / 2, MAXW = S.r - S.l - 40, K = E.keepout;
  const fx = document.getElementById("fx");
  const tl = gsap.timeline({ paused: true });
  const NS = "http://www.w3.org/2000/svg";
  let seed = 23;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);   // deterministic
  const el = (tag, cls, parent, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    (parent || fx).appendChild(n);
    return n;
  };

  // ------------------------------------------------------------ face- and centre-aware placement
  // Every graphic gets the union of her head boxes over its time window (px, from edit.py). place() scans the safe
  // area for the spot closest to the preferred position that keeps MARGIN px clear of her head, stays out of the
  // centre keep-out box (product + body) and never collides with a caption that is on screen at the time.
  const MARGIN = 44;
  const placed = [];                                  // {t0, t1, r} of captions already placed
  const ovl = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) *
                        Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  function place(w, h, o) {
    const heads = (o.heads || []).map(b => [b[0] - MARGIN, b[1] - MARGIN, b[2] + MARGIN, b[3] + MARGIN]);
    const avoid = o.isCaption ? [] : placed.filter(p => p.t0 < o.t1 && o.t0 < p.t1).map(p => p.r);
    const kw = o.keepW === undefined ? 1 : o.keepW;
    const x0 = S.l, x1 = Math.max(S.l, S.r - w), y0 = S.t + 24, y1 = Math.max(y0, S.b - h);
    let best = null;
    for (let y = y0; y <= y1; y += 6) {
      for (let x = x0; x <= x1; x += 6) {
        const r = [x, y, x + w, y + h];
        let c = Math.abs(y + h / 2 - o.py) * (o.wy || 1) + Math.abs(x + w / 2 - o.px) * (o.wx || 0.6);
        for (const hb of heads) { const a = ovl(r, hb); if (a > 0) c += 1e7 + a * 10; }
        const ka = ovl(r, K);
        if (ka > 0) c += kw >= 1 ? 3e6 + ka * 4 : ka * kw;
        for (const ar of avoid) { const a = ovl(r, ar); if (a > 0) c += 1e6 + a * 5; }
        if (!best || c < best.c) best = { x, y, c };
      }
    }
    best.clear = best.c < 1e6;
    return best;
  }
  const inKeep = (x, y) => x > K[0] && x < K[2] && y > K[1] && y < K[3];

  // ------------------------------------------------------------ svg bits: coffee bean, twine, latte swirl
  function bean(size, rot) {
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "0 0 40 52");
    s.style.cssText = `position:absolute;width:${size}px;height:${size * 1.3}px;opacity:0;overflow:visible`;
    s.innerHTML = `<ellipse cx="20" cy="26" rx="16" ry="22" fill="#5A3A22" stroke="#2A170C" stroke-width="3"/>` +
                  `<path d="M20,6 C12,18 28,32 20,46" fill="none" stroke="#2A170C" stroke-width="4" stroke-linecap="round"/>` +
                  `<ellipse cx="13" cy="18" rx="4" ry="7" fill="#8B5E3C" opacity="0.7"/>`;
    s.style.transform = `rotate(${rot}deg)`;
    fx.appendChild(s);
    return s;
  }
  // three beans pop out beside a tag (outside the centre box and her head only), then settle and fade
  function beanPop(r, t, heads) {
    const spots = [[r[0] - 26, r[1] - 10], [r[2] + 8, r[1] - 18], [r[2] + 14, r[3] - 26], [r[0] - 30, r[3] - 16]];
    let n = 0;
    for (const [x, y] of spots) {
      if (n >= 3) break;
      if (inKeep(x, y) || x < S.l - 30 || x > S.r - 30 || y < S.t) continue;
      if (heads.some(b => x > b[0] - 30 && x < b[2] + 30 && y > b[1] - 30 && y < b[3] + 30)) continue;
      const b = bean(30, rnd() * 360);
      b.style.left = x + "px"; b.style.top = y + "px";
      tl.fromTo(b, { opacity: 0, scale: 0.2, y: 0 }, { opacity: 1, scale: 1, y: -14, duration: 0.35, ease: "back.out(3)" },
        t + 0.1 + n * 0.06);
      tl.to(b, { opacity: 0, y: 6, duration: 0.25 }, t + 1.1 + n * 0.05);
      n++;
    }
  }

  // ------------------------------------------------------------ captions
  function caption(C) {
    const cap = el("div", "cap");
    const spans = C.words.map(w => {
      const s = el("span", "word" + (w.key ? " key" : ""), cap);
      el("span", "chip", s);
      el("span", "a", s, w.w);
      el("span", "y", s, w.w);
      return s;
    });
    let fs = 70;
    while (cap.offsetWidth > MAXW - 40 && fs > 40) { fs -= 2; cap.style.fontSize = fs + "px"; }
    const cw = cap.offsetWidth, ch = cap.offsetHeight;
    const p = place(cw + 40, ch + 36, { t0: C.t0, t1: C.t1, heads: C.heads, px: CX, py: C.y, wy: 1.4, wx: 0.8,
                                        isCaption: true, keepW: 0 });
    const cx = p.x + 20, cy = p.y + 16;
    cap.style.left = cx + "px";
    cap.style.top = cy + "px";
    placed.push({ t0: C.t0 - 0.05, t1: C.t1 + 0.05, r: [cx - 26, cy - 22, cx + cw + 26, cy + ch + 24] });
    C.placed = { x: cx, y: cy, w: cw, h: ch, clear: p.clear };
    tl.fromTo(cap, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, C.t0);
    C.words.forEach((w, i) => {
      const s = spans[i], chip = s.querySelector(".chip"), y = s.querySelector(".y"), a = s.querySelector(".a");
      tl.set([chip, y], { opacity: 1 }, w.s);
      tl.set(a, { opacity: 0 }, w.s);
      tl.fromTo(chip, { scaleX: 0.6, scaleY: 0.8 }, { scaleX: 1, scaleY: 1, duration: 0.14, ease: "back.out(2.5)" }, w.s);
      const off = i + 1 < C.words.length ? C.words[i + 1].s : C.t1;
      tl.set([chip, y], { opacity: 0 }, off);
      tl.set(a, { opacity: 1 }, off);
    });
    tl.to(cap, { opacity: 0, duration: 0.1 }, C.t1 - 0.1);
  }

  // ------------------------------------------------------------ labels: kraft tags on twine, compact
  let flip = 1;
  function tag(L) {
    const box = el("div", "kraft");
    const paper = el("div", "paper", box);
    el("span", "hole", paper);
    const words = L.html.split(/\s+/).filter(Boolean);   // <b> never spans a space
    const ws = words.map(w => el("span", "w", paper, w));
    const emo = el("span", "emo", paper, L.emoji);
    const tw = document.createElementNS(NS, "svg");
    tw.setAttribute("class", "twine");
    tw.setAttribute("viewBox", "0 0 110 60");
    tw.innerHTML = `<path d="M106,40 C70,40 40,10 2,6" fill="none" stroke="#E9D9B8" stroke-width="5" stroke-linecap="round"/>` +
                   `<path d="M106,40 C80,52 50,58 14,56" fill="none" stroke="#E9D9B8" stroke-width="5" stroke-linecap="round"/>`;
    box.insertBefore(tw, paper);
    const B = L.big;
    const configs = [
      { wrap: false, fs: B ? 62 : 56, min: B ? 50 : 46 },
      { wrap: true, maxw: 470, fs: B ? 58 : 52 },
      { wrap: true, maxw: 380, fs: B ? 50 : 46 },
      { wrap: true, maxw: 300, fs: 42 },
      { wrap: true, maxw: 250, fs: 38 },
      { wrap: true, maxw: 215, fs: 34 },
    ];
    let pick = null;
    for (const c of configs) {
      box.classList.toggle("wrapline", c.wrap);
      paper.style.maxWidth = c.wrap ? c.maxw + "px" : "none";
      let fs = c.fs;
      paper.style.fontSize = fs + "px";
      if (!c.wrap) {
        while (paper.offsetWidth > 620 && fs > c.min) { fs -= 2; paper.style.fontSize = fs + "px"; }
        if (paper.offsetWidth > 620) continue;
      } else {
        while ((paper.offsetWidth > c.maxw || paper.offsetHeight > 220) && fs > 32) {
          fs -= 2; paper.style.fontSize = fs + "px";
        }
      }
      const w = paper.offsetWidth, h = paper.offsetHeight;
      const p = place(w + 16, h + 24, { t0: L.t0, t1: L.t1, heads: L.heads, px: S.l + 330, py: E.lab_y,
                                        wy: 1, wx: 0.35 });
      const cand = { c, fs, w, h, p };
      if (p.clear) { pick = cand; break; }
      if (!pick || p.c < pick.p.c) pick = cand;
    }
    box.classList.toggle("wrapline", pick.c.wrap);
    paper.style.maxWidth = pick.c.wrap ? pick.c.maxw + "px" : "none";
    paper.style.fontSize = pick.fs + "px";
    const { w, h, p } = pick;
    const x = p.x + 8, y = p.y + 12;
    L.placed = { x, y, w, h, clear: p.clear, fs: pick.fs, wrap: pick.c.wrap };
    box.style.left = x + "px";
    box.style.top = y + "px";
    const rot = (B ? 2 : 1.5) * flip; flip = -flip;
    tl.set(box, { opacity: 1 }, L.t0);
    tl.fromTo(box, { x: -60, rotation: rot * 5, scale: 0.85 },
      { x: 0, rotation: rot, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, L.t0);
    tl.fromTo(ws, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, stagger: 0.05, ease: "power2.out" },
      L.t0 + 0.08);
    tl.fromTo(emo, { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" },
      L.t0 + 0.18);
    tl.to(box, { rotation: -rot * 0.6, duration: 1.4, yoyo: true, repeat: Math.max(0, Math.floor((L.t1 - L.t0 - 0.8) / 1.4)),
      ease: "sine.inOut" }, L.t0 + 0.6);
    if (L.big) beanPop([x, y, x + w, y + h], L.t0, L.heads || []);
    tl.to(box, { x: -40, opacity: 0, duration: 0.16, ease: "power2.in" }, L.t1 - 0.16);
  }

  // ------------------------------------------------------------ steam flash (edges only)
  function steam(F) {
    const s = el("div", "steam");
    tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, F.t - 0.12);
    tl.to(s, { opacity: 0, duration: 0.3, ease: "power1.in" }, F.t + 0.02);
  }

  // ------------------------------------------------------------ end card: compact chalkboard menu
  function endcard(N) {
    const b = el("div", "board");
    const t = el("div", "title", b, N.title);
    el("div", "rule", b);
    const s = el("div", "sub", b, N.sizes);
    const c = el("div", "cta", b, N.cta);
    const w = b.offsetWidth, h = b.offsetHeight;
    const p = place(w, h, { t0: N.t0, t1: N.t1, heads: N.heads, px: CX, py: N.py || 1300, wy: 0.6, wx: 0.6,
                            keepW: 0.5 });
    N.placed = { x: p.x, y: p.y, w, h, clear: p.clear };
    b.style.left = p.x + "px";
    b.style.top = p.y + "px";
    tl.fromTo(b, { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.8)" },
      N.t0);
    tl.fromTo([t, s, c], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, stagger: 0.12, ease: "power2.out" },
      N.t0 + 0.12);
    tl.fromTo(c, { scale: 1 }, { scale: 1.06, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, N.t0 + 0.5);
  }

  function twine() {
    const v = el("div", "", fx);
    v.id = "twine";
    v.style.left = S.l + "px";
    v.style.top = (S.t + 6) + "px";
    v.style.width = (S.r - S.l) + "px";
    const f = el("div", "fill", v);
    const cup = el("div", "cup", v, "☕");
    tl.fromTo(f, { scaleX: 0 }, { scaleX: 1, duration: E.total, ease: "none" }, 0);
    tl.fromTo(cup, { x: 0 }, { x: S.r - S.l, duration: E.total, ease: "none" }, 0);
  }

  function build() {
    twine();
    E.captions.forEach(caption);                // captions first: labels then steer around them
    E.labels.forEach(tag);
    E.flashes.forEach(steam);
    endcard(E.end);
    window.__placement = { captions: E.captions.map(c => c.placed), labels: E.labels.map(l => l.placed),
                           end: E.end.placed };
    tl.to({}, { duration: 0 }, E.total);
    window.__timelines["main"] = tl;
  }
  document.fonts.load('700 66px "Fredoka"').then(build);
})();
</script>
</body>
</html>
