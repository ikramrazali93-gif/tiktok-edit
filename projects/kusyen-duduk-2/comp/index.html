<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<!-- Kusyen duduk, video 2 (IMG_3067), "Majalah hiasan rumah" look: interior-magazine headlines in Playfair Display
     on off-white paper with a double hairline frame and a red issue kicker; slim photo-caption lines (rule + caps);
     captions on a charcoal strip with keywords in Playfair italic and a red rule gliding under the spoken word;
     corner crop marks, a hairline progress rule, edge-only page-turn accents with a light flash, and a
     magazine-cover end card (masthead on top, cover lines at the bottom).
     User rule for this series: nothing in the centre KEEP_OUT box (x 160-920, y 480-1340), few compact labels.
     The cut video (base.mp4), timings and her head boxes come from edit.py via data.js; this file draws, animates
     and places every graphic where it keeps clear of her face and of the centre. -->
<script src="gsap.min.js"></script>
<script src="data.js"></script>
<style>
  @font-face { font-family: "Inter Display"; src: url("InterDisplay-Medium.otf") format("opentype"); font-weight: 500; }
  @font-face { font-family: "Inter Display"; src: url("InterDisplay-SemiBold.otf") format("opentype"); font-weight: 600; }
  @font-face { font-family: "Inter Display"; src: url("InterDisplay-Bold.otf") format("opentype"); font-weight: 700; }
  @font-face { font-family: "Playfair Display"; src: url("PlayfairDisplay.ttf") format("truetype"); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: "Playfair Display"; src: url("PlayfairDisplay-Italic.ttf") format("truetype"); font-weight: 400 900; font-style: italic; }
  :root { --paper: #F7F3ED; --ink: #1F1C1A; --red: #C21F2C; --red2: #FF5A5F; --beige: #C9A27E; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #root { width: 100%; height: 100%; position: relative; overflow: hidden;
          font-family: "Inter Display", "Noto Color Emoji", sans-serif; color: var(--ink); }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #fx { position: absolute; inset: 0; pointer-events: none; }

  /* headline: off-white paper, double hairline frame, red kicker, Playfair headline */
  .hd { position: absolute; left: 0; top: 0; opacity: 0; }
  .hd .card { position: relative; background: var(--paper); padding: 11px 26px 12px; box-shadow: 0 18px 40px rgba(20, 14, 10, 0.28); }
  .hd .frame { position: absolute; inset: 5px; border: 1.5px solid rgba(31, 28, 26, 0.55); pointer-events: none; }
  .hd .kick { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 19px; line-height: 1;
              letter-spacing: 5px; text-transform: uppercase; color: var(--red); white-space: nowrap; }
  .hd .kick .rule { width: 36px; height: 2px; background: var(--red); transform-origin: 0 50%; }
  .hd .head { margin-top: 4px; font-family: "Playfair Display", serif; font-weight: 700; font-size: 58px;
              line-height: 1.0; letter-spacing: -0.5px; white-space: nowrap; }
  .hd .head i { font-style: italic; font-weight: 600; color: var(--red); }
  .hd .head .w { display: inline-block; }
  .hd.nokick .kick { display: none; }
  .hd.nokick .head { margin-top: 0; }

  /* photo-caption line: hairline, small red square, caps */
  .ln { position: absolute; left: 0; top: 0; opacity: 0; display: flex; align-items: center; gap: 14px;
        padding: 9px 20px 9px 16px; background: rgba(247, 243, 237, 0.94); white-space: nowrap;
        box-shadow: 0 10px 26px rgba(20, 14, 10, 0.22); }
  .ln .sq { width: 12px; height: 12px; background: var(--red); flex: none; }
  .ln .tx { font-weight: 600; font-size: 25px; line-height: 1; letter-spacing: 3.5px; text-transform: uppercase; }
  .ln .tx .emo { letter-spacing: 0; margin-left: 6px; }
  .ln .hl { position: absolute; left: 0; right: 0; height: 1.5px; background: var(--ink); transform-origin: 0 50%; }
  .ln .hl.t { top: -6px; } .ln .hl.b { bottom: -6px; }

  /* captions: charcoal strip, off-white words, keywords in Playfair italic, red rule under the spoken word */
  .cap { position: absolute; left: 0; top: 0; opacity: 0; display: flex; gap: 16px; align-items: baseline;
         padding: 10px 26px 16px; background: rgba(31, 28, 26, 0.84); font-weight: 600; font-size: 46px;
         line-height: 1.1; letter-spacing: -0.3px; white-space: nowrap; color: var(--paper); }
  .cap .word { position: relative; display: inline-block; }
  .cap .word.key { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 1.08em; }
  .cap .ul { position: absolute; left: 0; bottom: 9px; height: 4px; background: var(--red2); width: 10px; }

  /* crop marks + hairline progress rule */
  .crop { position: absolute; width: 34px; height: 34px; border-color: rgba(247, 243, 237, 0.75); border-style: solid; border-width: 0; }
  #prog { position: absolute; height: 3px; background: rgba(247, 243, 237, 0.45); }
  #prog .fill { position: absolute; inset: 0; background: var(--red2); transform-origin: 0 50%; }

  /* page-turn accent (edge only): red rule sweeps the top edge, folio number, light flash */
  .sweep { position: absolute; height: 5px; background: var(--red2); transform-origin: 0 50%; }
  .folio { position: absolute; font-family: "Playfair Display", serif; font-style: italic; font-weight: 600;
           font-size: 34px; color: var(--paper); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45); opacity: 0; }
  .flash { position: absolute; inset: 0; background: #FFFDF8; opacity: 0; }

  /* end card: magazine cover = masthead strip on top + cover lines at the bottom */
  .mast { position: absolute; left: 0; top: 0; opacity: 0; display: flex; align-items: baseline; gap: 18px;
          background: var(--paper); padding: 6px 26px 10px; box-shadow: 0 18px 40px rgba(20, 14, 10, 0.28); white-space: nowrap; }
  .mast .t { font-family: "Playfair Display", serif; font-weight: 800; font-size: 66px; line-height: 1.0;
             letter-spacing: -1px; color: var(--ink); }
  .mast .t i { font-style: italic; font-weight: 700; color: var(--red); }
  .mast .iss { font-weight: 600; font-size: 19px; letter-spacing: 4px; text-transform: uppercase; color: var(--red); }
  .cover { position: absolute; left: 0; top: 0; opacity: 0; display: flex; flex-direction: column; gap: 8px;
           align-items: flex-start; }
  .cover .ln2 { background: var(--paper); padding: 8px 18px; font-weight: 600; font-size: 28px; letter-spacing: 2px;
                white-space: nowrap; }
  .cover .cta { background: var(--red); color: var(--paper); padding: 10px 24px 12px; font-weight: 700; font-size: 36px;
                white-space: nowrap; box-shadow: 0 14px 30px rgba(20, 14, 10, 0.3); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="32.140" data-width="1080" data-height="1920">
  <video id="bg" class="clip" src="base.mp4" data-start="0" data-duration="32.140" muted playsinline></video>
  <div id="fx"></div>
</div>
<script>
(function () {
  const E = window.EDIT, S = E.safe, CX = (S.l + S.r) / 2, MAXW = S.r - S.l - 40;
  const KO = E.keep_out;                                  // centre keep-out box [x0, y0, x1, y1]
  const fx = document.getElementById("fx");
  const tl = gsap.timeline({ paused: true });
  const el = (tag, cls, parent, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    (parent || fx).appendChild(n);
    return n;
  };

  // ------------------------------------------------------------ face- and centre-aware placement
  // Every graphic gets the union of her head boxes over its time window (px, from edit.py). place() scans the
  // safe area for the spot closest to the preferred position whose box keeps MARGIN px clear of her head, stays
  // out of the centre keep-out box (labels) and never collides with a caption on screen at the time.
  const MARGIN = 44;
  const placed = [];
  const ovl = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) *
                        Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  function place(w, h, o) {
    const heads = (o.heads || []).map(b => [b[0] - MARGIN, b[1] - MARGIN, b[2] + MARGIN, b[3] + MARGIN]);
    const avoid = o.isCaption ? [] : placed.filter(p => p.t0 < o.t1 && o.t0 < p.t1).map(p => p.r);
    const x0 = S.l, x1 = Math.max(S.l, S.r - w), y0 = S.t + 14, y1 = Math.max(y0, S.b - h);
    let best = null;
    for (let y = y0; y <= y1; y += 4) {
      for (let x = x0; x <= x1; x += 6) {
        const r = [x, y, x + w, y + h];
        let c = Math.abs(y + h / 2 - o.py) * (o.wy || 1) + Math.abs(x + w / 2 - o.px) * (o.wx || 0.6);
        for (const hb of heads) { const a = ovl(r, hb); if (a > 0) c += 1e7 + a * 10; }
        if (!o.isCaption && !o.allowCentre) { const a = ovl(r, KO); if (a > 0) c += 1e7 + a * 10; }
        for (const ar of avoid) { const a = ovl(r, ar); if (a > 0) c += 1e6 + a * 5; }
        if (!best || c < best.c) best = { x, y, c };
      }
    }
    best.clear = best.c < 1e6;
    return best;
  }

  // ------------------------------------------------------------ captions
  function caption(C) {
    const cap = el("div", "cap");
    const spans = C.words.map(w => el("span", "word" + (w.key ? " key" : ""), cap, w.w));
    const ul = el("div", "ul", cap);
    let fs = 46;
    while (cap.offsetWidth > MAXW && fs > 32) { fs -= 2; cap.style.fontSize = fs + "px"; }
    const cw = cap.offsetWidth, ch = cap.offsetHeight;
    const p = place(cw, ch, { t0: C.t0, t1: C.t1, heads: C.heads, px: CX, py: C.y, wy: 1.4, wx: 0.8,
                              isCaption: true });
    cap.style.left = p.x + "px";
    placed.push({ t0: C.t0 - 0.05, t1: C.t1 + 0.05, r: [p.x - 6, p.y - 6, p.x + cw + 6, p.y + ch + 6] });
    C.placed = { x: p.x, y: p.y, w: cw, h: ch, clear: p.clear };
    tl.fromTo(cap, { opacity: 0, y: p.y + 12 }, { opacity: 1, y: p.y, duration: 0.25, ease: "power3.out" }, C.t0);
    const first = spans[0];
    tl.set(ul, { x: first.offsetLeft, width: first.offsetWidth, opacity: 1 }, C.t0);
    C.words.forEach((w, i) => {
      const s = spans[i];
      tl.to(ul, { x: s.offsetLeft, width: s.offsetWidth, duration: 0.16, ease: "power2.out" }, w.s);
      tl.to(s, { color: "#FFB3B5", duration: 0.1 }, w.s);
      const off = i + 1 < C.words.length ? C.words[i + 1].s : C.t1;
      tl.to(s, { color: "#F7F3ED", duration: 0.1 }, off);
    });
    tl.to(cap, { opacity: 0, duration: 0.14 }, C.t1 - 0.14);
  }

  // ------------------------------------------------------------ headline (magazine box)
  function words(html, parent) {
    // keep "<i>A B</i>" runs together, split the rest into words
    const ws = html.split(/\s+/).filter(Boolean), groups = [];
    let cur = null;
    for (const w of ws) {
      if (cur) { cur += " " + w; if (w.includes("</i>")) { groups.push(cur); cur = null; } }
      else if (w.includes("<i>") && !w.includes("</i>")) cur = w;
      else groups.push(w);
    }
    if (cur) groups.push(cur);
    return groups.map((g, i) => el("span", "w", parent, g + (i < groups.length - 1 ? "&nbsp;" : "")));
  }

  function headline(L) {
    const box = el("div", "hd");
    const c = el("div", "card", box);
    el("div", "frame", c);
    const kick = el("div", "kick", c, `<span class="rule"></span><span>${L.kick}</span>`);
    const head = el("div", "head", c);
    const ws = words(L.html, head);
    const configs = [
      { kick: true, fs: 58 }, { kick: true, fs: 50 }, { kick: false, fs: 58 }, { kick: false, fs: 48 },
      { kick: false, fs: 42 },
    ];
    let pick = null;
    for (const cf of configs) {
      box.classList.toggle("nokick", !cf.kick || !L.kick);
      let fs = cf.fs;
      head.style.fontSize = fs + "px";
      while (c.offsetWidth > MAXW && fs > 36) { fs -= 2; head.style.fontSize = fs + "px"; }
      const w = c.offsetWidth, h = c.offsetHeight;
      const p = place(w + 4, h + 4, { t0: L.t0, t1: L.t1, heads: L.heads, px: CX, py: L.py, wy: 1, wx: 0.5 });
      const cand = { cf, fs, w, h, p };
      if (p.clear) { pick = cand; break; }
      if (!pick || p.c < pick.p.c) pick = cand;
    }
    box.classList.toggle("nokick", !pick.cf.kick || !L.kick);
    head.style.fontSize = pick.fs + "px";
    const { w, h, p } = pick;
    const x = p.x + 2, y = p.y + 2;
    placed.push({ t0: L.t0, t1: L.t1, r: [x, y, x + w, y + h] });
    L.placed = { x, y, w, h, clear: p.clear, fs: pick.fs, kick: pick.cf.kick };
    box.style.left = x + "px";
    box.style.top = y + "px";
    const rule = kick.querySelector(".rule");
    tl.set(box, { opacity: 1 }, L.t0);
    tl.fromTo(c, { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.inOut" }, L.t0);
    tl.fromTo(kick, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, L.t0 + 0.15);
    tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, L.t0 + 0.18);
    tl.fromTo(ws, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.42, stagger: 0.06, ease: "power3.out" }, L.t0 + 0.2);
    tl.to(box, { opacity: 0, y: "-=8", duration: 0.24, ease: "power2.in" }, L.t1 - 0.24);
  }

  // ------------------------------------------------------------ photo-caption line
  function line(L) {
    const b = el("div", "ln");
    const ht = el("div", "hl t", b), hb = el("div", "hl b", b);
    el("div", "sq", b);
    const tx = el("div", "tx", b, L.html + (L.emoji ? `<span class="emo">${L.emoji}</span>` : ""));
    let fs = 25;
    while (b.offsetWidth > MAXW && fs > 18) { fs -= 1; tx.style.fontSize = fs + "px"; }
    const w = b.offsetWidth, h = b.offsetHeight;
    const p = place(w, h + 12, { t0: L.t0, t1: L.t1, heads: L.heads, px: S.l + w / 2 + 6, py: L.py, wy: 1, wx: 0.3 });
    const x = p.x, y = p.y + 6;
    placed.push({ t0: L.t0, t1: L.t1, r: [x, y - 6, x + w, y + h + 6] });
    L.placed = { x, y, w, h, clear: p.clear, fs };
    b.style.left = x + "px";
    b.style.top = y + "px";
    tl.set(b, { opacity: 1 }, L.t0);
    tl.fromTo(b, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" }, L.t0);
    tl.set(b, { clipPath: "none" }, L.t0 + 0.46);
    tl.fromTo([ht, hb], { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, L.t0 + 0.08);
    tl.to(b, { opacity: 0, duration: 0.2 }, L.t1 - 0.2);
  }

  // ------------------------------------------------------------ page-turn accent (edges only) + light flash
  function turn(T) {
    const fl = el("div", "flash");
    tl.fromTo(fl, { opacity: 0 }, { opacity: 0.32, duration: 0.06, ease: "none" }, T.t - 0.03);
    tl.to(fl, { opacity: 0, duration: 0.2, ease: "power2.out" }, T.t + 0.03);
    const sw = el("div", "sweep");
    sw.style.left = S.l + "px"; sw.style.top = (S.t + 2) + "px"; sw.style.width = (S.r - S.l) + "px";
    tl.fromTo(sw, { scaleX: 0, opacity: 1, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, T.t - 0.1);
    tl.to(sw, { opacity: 0, duration: 0.25 }, T.t + 0.45);
    const fo = el("div", "folio", fx, `— ${T.folio}`);
    fo.style.left = (S.l + 4) + "px"; fo.style.top = (S.t + 16) + "px";
    tl.fromTo(fo, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, T.t);
    tl.to(fo, { opacity: 0, duration: 0.3 }, T.t + 0.9);
  }

  // ------------------------------------------------------------ crop marks + progress rule
  function chrome() {
    const m = 34, t = S.t + 18, b = S.b - 4;
    const marks = [
      [S.l - 30, t, "border-left-width:2px;border-top-width:2px"],
      [S.r - m, t, "border-right-width:2px;border-top-width:2px"],
      [S.l - 30, b - m, "border-left-width:2px;border-bottom-width:2px"],
      [S.r - m, b - m, "border-right-width:2px;border-bottom-width:2px"],
    ];
    for (const [x, y, st] of marks) {
      const c = el("div", "crop");
      c.style.cssText += `left:${x}px;top:${y}px;${st}`;
      tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.1);
    }
    const v = el("div", "", fx);
    v.id = "prog";
    v.style.left = S.l + "px"; v.style.top = (S.t + 6) + "px"; v.style.width = (S.r - S.l) + "px";
    const f = el("div", "fill", v);
    tl.fromTo(f, { scaleX: 0 }, { scaleX: 1, duration: E.total, ease: "none" }, 0);
  }

  // ------------------------------------------------------------ end card: magazine cover
  function endcard(N) {
    const m = el("div", "mast", fx);
    const mt = el("div", "t", m, N.mast.replace(/(\S+)$/, "<i>$1</i>"));
    el("div", "iss", m, N.issue);
    let fs = 66;
    while (m.offsetWidth > MAXW && fs > 44) { fs -= 2; mt.style.fontSize = fs + "px"; }
    const pm0 = place(m.offsetWidth, m.offsetHeight, { t0: N.t0, t1: N.t1, heads: N.heads, px: CX, py: S.t + 60, wy: 1, wx: 0.5 });
    while (!pm0.clear && fs > 44) {        // the top band is short when her head is high: shrink until it fits
      fs -= 4; mt.style.fontSize = fs + "px";
      Object.assign(pm0, place(m.offsetWidth, m.offsetHeight, { t0: N.t0, t1: N.t1, heads: N.heads, px: CX, py: S.t + 60, wy: 1, wx: 0.5 }));
    }
    const pm = pm0, mw = m.offsetWidth, mh = m.offsetHeight;
    m.style.left = pm.x + "px"; m.style.top = pm.y + "px";
    const cv = el("div", "cover");
    const rows = [el("div", "ln2", cv, N.lines), el("div", "cta", cv, N.cta)];
    const cw = cv.offsetWidth, ch = cv.offsetHeight;
    const pc = place(cw, ch, { t0: N.t0, t1: N.t1, heads: N.heads, px: S.l + cw / 2, py: S.b - ch / 2, wy: 1, wx: 0.3 });
    cv.style.left = pc.x + "px"; cv.style.top = pc.y + "px";
    N.placed = { mast: { x: pm.x, y: pm.y, w: mw, h: mh, clear: pm.clear }, cover: { x: pc.x, y: pc.y, w: cw, h: ch, clear: pc.clear } };
    tl.set(m, { opacity: 1 }, N.t0 + 0.05);
    tl.fromTo(m, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut" }, N.t0 + 0.05);
    tl.set(cv, { opacity: 1 }, N.t0 + 0.25);
    tl.fromTo(rows, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.12, ease: "power3.out" }, N.t0 + 0.25);
    tl.to(rows[1], { scale: 1.04, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "0 50%" }, N.t0 + 1.2);
  }

  function build() {
    chrome();
    E.captions.forEach(caption);                 // captions first: labels then steer around them
    E.labels.forEach(L => (L.style === "head" ? headline : line)(L));
    endcard(E.end);
    E.turns.forEach(turn);
    window.__placement = { captions: E.captions.map(c => c.placed), labels: E.labels.map(l => l.placed),
                           end: E.end.placed };
    tl.to({}, { duration: 0 }, E.total);
    window.__timelines["main"] = tl;
  }
  Promise.all([document.fonts.load('500 30px "Inter Display"'), document.fonts.load('600 60px "Inter Display"'),
               document.fonts.load('700 60px "Inter Display"'), document.fonts.load('700 60px "Playfair Display"'),
               document.fonts.load('italic 600 60px "Playfair Display"'), document.fonts.load('800 60px "Playfair Display"')]).then(build);
})();
</script>
</body>
</html>
