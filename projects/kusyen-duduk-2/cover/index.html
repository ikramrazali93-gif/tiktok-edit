<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1536" />
<!-- Cover 1080x1536 for kusyen duduk, video 2, "Majalah hiasan rumah" look: an interior-magazine cover. Issue line
     and Playfair masthead in the sky above her hood, cover lines and a red size tag in the band below the cushions,
     thin crop marks. Her face (x 310-690, y 226-744 in this layout) and both cushions are left clear; key text sits
     inside the 3:4 crop (y 48-1488); the 40x40 tag sits in the sky right of her hood.
     Render: npx --prefix ../comp hyperframes snapshot . --at 0.5 --no-end -o snap   (see ../EDIT_PLAN.md) -->
<script src="gsap.min.js"></script>
<style>
  @font-face { font-family: "Inter Display"; src: url("InterDisplay-Medium.otf") format("opentype"); font-weight: 500; }
  @font-face { font-family: "Inter Display"; src: url("InterDisplay-SemiBold.otf") format("opentype"); font-weight: 600; }
  @font-face { font-family: "Inter Display"; src: url("InterDisplay-Bold.otf") format("opentype"); font-weight: 700; }
  @font-face { font-family: "Playfair Display"; src: url("PlayfairDisplay.ttf") format("truetype"); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: "Playfair Display"; src: url("PlayfairDisplay-Italic.ttf") format("truetype"); font-weight: 400 900; font-style: italic; }
  :root { --paper: #F7F3ED; --ink: #1F1C1A; --red: #C21F2C; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1536px; overflow: hidden; background: var(--paper); }
  #root { width: 100%; height: 100%; position: relative; overflow: hidden;
          font-family: "Inter Display", "Noto Color Emoji", sans-serif; color: var(--ink); }
  /* frame.jpg is the 1080x1920 frame at 10.2s (beige cushion left, red right, her face upper middle),
     shifted up 120px */
  #photo { position: absolute; left: 0; top: -120px; width: 1080px; height: 1920px; }
  /* soft paper fade at the very top and bottom so the masthead and cover lines read over sky and road */
  #fadeT { position: absolute; left: 0; right: 0; top: 0; height: 250px;
           background: linear-gradient(rgba(247, 243, 237, 0.92), rgba(247, 243, 237, 0)); }
  #fadeB { position: absolute; left: 0; right: 0; bottom: 0; height: 330px;
           background: linear-gradient(rgba(247, 243, 237, 0), rgba(247, 243, 237, 0.95) 45%); }
  .crop { position: absolute; width: 40px; height: 40px; border: 0 solid rgba(31, 28, 26, 0.7); }
  #iss { position: absolute; left: 60px; top: 58px; right: 60px; display: flex; justify-content: space-between;
         font-weight: 600; font-size: 21px; letter-spacing: 6px; text-transform: uppercase; color: var(--red); }
  #iss .rule { flex: 1; height: 2px; background: var(--red); margin: 10px 22px 0; }
  #mast { position: absolute; left: 0; right: 0; top: 88px; text-align: center; font-family: "Playfair Display", serif;
          font-weight: 800; font-size: 118px; line-height: 1; letter-spacing: -2px; }
  #mast i { font-style: italic; font-weight: 700; color: var(--red); }
  #lines { position: absolute; left: 60px; bottom: 74px; }
  #lines .k { font-weight: 600; font-size: 22px; letter-spacing: 6px; text-transform: uppercase; color: var(--red); }
  #lines .h { margin-top: 8px; font-family: "Playfair Display", serif; font-weight: 700; font-size: 74px; line-height: 1.0;
              letter-spacing: -1px; }
  #lines .h i { font-style: italic; font-weight: 600; color: var(--red); }
  #lines .s { margin-top: 14px; font-weight: 600; font-size: 28px; letter-spacing: 1px; color: #4A4440; }
  #tag { position: absolute; right: 60px; top: 262px; background: var(--red); color: var(--paper); padding: 16px 22px 18px;
         text-align: center; box-shadow: 0 16px 34px rgba(20, 14, 10, 0.3); }
  #tag .n { font-family: "Playfair Display", serif; font-weight: 800; font-size: 52px; line-height: 1; }
  #tag .u { margin-top: 4px; font-weight: 600; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1536">
  <img id="photo" src="frame.jpg" alt="" />
  <div id="fadeT"></div>
  <div id="fadeB"></div>
  <div class="crop" style="left:24px;top:24px;border-left-width:2px;border-top-width:2px"></div>
  <div class="crop" style="right:24px;top:24px;border-right-width:2px;border-top-width:2px"></div>
  <div class="crop" style="left:24px;bottom:24px;border-left-width:2px;border-bottom-width:2px"></div>
  <div class="crop" style="right:24px;bottom:24px;border-right-width:2px;border-bottom-width:2px"></div>
  <div id="iss"><span>Edisi 02</span><span class="rule"></span><span>Ruang duduk</span></div>
  <div id="mast">Kusyen <i>Duduk</i></div>
  <div id="tag"><div class="n">40×40</div><div class="u">cm · tebal</div></div>
  <div id="lines">
    <div class="k">Untuk mak &amp; ibu mengandung</div>
    <div class="h">Tak boleh <i>duduk lama?</i></div>
    <div class="s">Selesa dalam kereta · Merah &amp; beige</div>
  </div>
</div>
<script>
  Promise.all([document.fonts.load('600 30px "Inter Display"'), document.fonts.load('800 100px "Playfair Display"'),
               document.fonts.load('italic 700 100px "Playfair Display"')]).then(() => {
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 1 }, 0);
    window.__timelines["cover"] = tl;
  });
</script>
</body>
</html>
